<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ATOYAC · All Day Healthy Food</title>
  <meta name="description" content="ATOYAC · All Day Healthy Food. Menú, pedidos por WhatsApp, Uber, DiDi, Rappi y recomendaciones." />
  
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
  
  <!-- Google Font: Montserrat (pesos delgados 200, 300, 400, 500) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">

  <!-- Google Analytics 4 (GA4) + Conversion Tracking -->
  <script src="/js/analytics.js" defer></script>

  <style>
    :root {
      --bg-cream: #FAF8F5;
      --bg-gradient: radial-gradient(circle at 50% 38%, #FFFFFF 0%, #FAF8F5 55%, #F4F1EA 100%);
      --text-dark: #1A281F;
      --text-muted: #5C6E61;
      --icon-green: #1EA355; /* Mismo color verde uniforme para todos los íconos */
      --btn-bg: #FFFFFF;
      --btn-border: #D1D5DB; /* Borde gris sutil y limpio */
      --btn-border-hover: #9CA3AF;
      --font-montserrat: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
    }

    body {
      background: var(--bg-cream);
      background-image: var(--bg-gradient);
      color: var(--text-dark);
      font-family: var(--font-montserrat);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2vh 1.25rem 3.5vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Contenedor principal que distribuye: 50% Logo, 20% Texto, 30% Botones */
    .viewport-container {
      width: 100%;
      max-width: 1200px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      margin: auto 0;
    }

    /* ===================================================================
       1. LOGO: ABARCA CASI EL 50% DE LA PANTALLA CON SU ANIMACIÓN
       =================================================================== */
    .logo-hero-section {
      width: 100%;
      height: 48vh;
      min-height: 240px;
      max-height: 460px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo-svg {
      height: 92%;
      max-height: 420px;
      width: auto;
      aspect-ratio: 165 / 100;
      overflow: visible;
      filter: drop-shadow(0 6px 20px rgba(30, 45, 34, 0.05));
    }

    /* Animación de trazo (stroke) estilo dibujo a mano */
    .anim-ray, 
    .anim-sun-arc, 
    .anim-leaf, 
    .anim-leaf-nerve {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation-fill-mode: forwards;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 1. Rayos del sol se pintan uno por uno */
    .ray-1 { animation: strokeDraw 0.5s 0.2s forwards; }
    .ray-2 { animation: strokeDraw 0.5s 0.35s forwards; }
    .ray-3 { animation: strokeDraw 0.5s 0.45s forwards; }
    .ray-4 { animation: strokeDraw 0.5s 0.55s forwards; }
    .ray-5 { animation: strokeDraw 0.5s 0.65s forwards; }
    .ray-6 { animation: strokeDraw 0.5s 0.75s forwards; }

    /* 2. El arco del sol se dibuja por encima */
    .anim-sun-arc {
      animation: strokeDraw 1.1s 0.85s forwards;
    }

    /* 3. La hojita enmedio se dibuja y luego se rellena de verde */
    .anim-leaf {
      stroke: #1E2D22;
      fill: #698975;
      fill-opacity: 0;
      animation: strokeDraw 1.2s 1.7s forwards, fillLeafIn 0.8s 2.7s forwards;
    }

    /* 4. Nervio de la hoja */
    .anim-leaf-nerve {
      animation: strokeDraw 0.7s 2.3s forwards;
    }

    @keyframes strokeDraw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fillLeafIn {
      to {
        fill-opacity: 0.32;
      }
    }

    /* ===================================================================
       2. TÍTULO ATOYAC (20% DE LA PANTALLA EN MONTSERRAT DELGADA)
       =================================================================== */
    .brand-section {
      width: 100%;
      height: auto;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeInUp 0.9s 2.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      margin: 1vh 0 1.5vh;
    }

    .brand-title {
      font-family: var(--font-montserrat);
      font-weight: 200; /* Montserrat súper delgada y elegante */
      font-size: clamp(2.8rem, 7.5vw, 4.6rem);
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--text-dark);
      line-height: 1;
      padding-left: 0.26em; /* Equilibrio visual del tracking */
    }

    .btn-menu-prominent {
      margin: 0.85rem 0 0.55rem;
      padding: 0.65rem 1.5rem;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .brand-subtitle {
      font-family: var(--font-montserrat);
      font-weight: 400;
      font-size: clamp(0.72rem, 1.8vw, 0.88rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.15rem;
      padding-left: 0.32em;
    }

    /* ===================================================================
       3. BOTONES EN UNA SOLA FILA CON BORDE GRIS, MONTSERRAT E ÍCONO VERDE
       =================================================================== */
    .buttons-row-section {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(18px);
      animation: fadeInUp 0.9s 3.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      padding: 0.5rem 0;
    }

    .single-row-nav {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.6rem;
      width: 100%;
    }

    /* Botón estándar con borde gris y texto en Montserrat */
    .btn-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--btn-bg);
      border: 1.5px solid var(--btn-border);
      border-radius: 999px;
      padding: 0.6rem 1.15rem;
      color: var(--text-dark);
      text-decoration: none;
      font-family: var(--font-montserrat);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      cursor: pointer;
    }

    .btn-pill:hover {
      background: #FFFFFF;
      border-color: var(--btn-border-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.07);
    }

    .btn-pill:active {
      transform: scale(0.97);
    }

    /* Botones de solo ícono (Instagram y TikTok) */
    .btn-pill.icon-only {
      padding: 0.6rem;
      width: 42px;
      height: 42px;
      justify-content: center;
    }

    /* ÍCONOS: TODOS COMPARTEN EL MISMO COLOR VERDE */
    .icon-green {
      width: 18px;
      height: 18px;
      color: var(--icon-green);
      fill: currentColor;
      flex-shrink: 0;
    }

    .icon-green-stroke {
      width: 18px;
      height: 18px;
      stroke: var(--icon-green);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Ajustes para pantallas móviles */
    @media (max-width: 768px) {
      .logo-hero-section {
        height: 42vh;
      }
      .brand-section {
        height: 18vh;
      }
      .single-row-nav {
        gap: 0.45rem;
      }
      .btn-pill {
        padding: 0.55rem 0.9rem;
        font-size: 0.76rem;
      }
      .btn-pill.icon-only {
        width: 38px;
        height: 38px;
        padding: 0.5rem;
      }
    }
  </style>
</head>
<body>

<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gran Inauguración · ATOYAC | Reclama tu Café Gratis ☕</title>
  <meta name="description" content="Gran inauguración este sábado 5 de diciembre. Síguenos en Instagram y reclama tu café gratis por WhatsApp." />
  
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
  
  <!-- Google Fonts: Montserrat (pesos 200, 300, 400, 500, 600, 700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-cream: #FAF8F5;
      --bg-gradient: radial-gradient(circle at 50% 32%, #FFFFFF 0%, #FAF8F5 55%, #F4F1EA 100%);
      --forest-dark: #1A281F;
      --forest-sage: #5A6D5F;
      --icon-green: #1EA355;
      --wa-green: #25D366;
      --wa-dark: #128C7E;
      --ig-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --card-bg: #FFFFFF;
      --border-subtle: #E2E8F0;
      --font-montserrat: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    body {
      background: var(--bg-cream);
      background-image: var(--bg-gradient);
      color: var(--forest-dark);
      font-family: var(--font-montserrat);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 2.5rem;
      overflow-x: hidden;
      position: relative;
    }

    .main-card-wrap {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto 0;
    }

    /* ===================================================================
       1. LOGO GRANDOTE Y ANIMADO (SE PINTA EL SOL Y LUEGO LA HOJITA)
       =================================================================== */
    .logo-hero-wrap {
      width: clamp(170px, 45vw, 220px);
      height: auto;
      aspect-ratio: 165 / 100;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
    }

    .logo-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 6px 16px rgba(26, 40, 31, 0.06));
    }

    /* Animación de trazo (stroke) */
    .anim-ray, 
    .anim-sun-arc, 
    .anim-leaf, 
    .anim-leaf-nerve {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation-fill-mode: forwards;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Rayos de sol */
    .ray-1 { animation: strokeDraw 0.5s 0.2s forwards; }
    .ray-2 { animation: strokeDraw 0.5s 0.35s forwards; }
    .ray-3 { animation: strokeDraw 0.5s 0.45s forwards; }
    .ray-4 { animation: strokeDraw 0.5s 0.55s forwards; }
    .ray-5 { animation: strokeDraw 0.5s 0.65s forwards; }
    .ray-6 { animation: strokeDraw 0.5s 0.75s forwards; }

    /* Arco del sol */
    .anim-sun-arc {
      animation: strokeDraw 1.1s 0.85s forwards;
    }

    /* Hojita central */
    .anim-leaf {
      stroke: #1E2D22;
      fill: #698975;
      fill-opacity: 0;
      animation: strokeDraw 1.2s 1.7s forwards, fillLeafIn 0.8s 2.7s forwards;
    }

    .anim-leaf-nerve {
      animation: strokeDraw 0.7s 2.3s forwards;
    }

    @keyframes strokeDraw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fillLeafIn {
      to {
        fill-opacity: 0.32;
      }
    }

    /* ===================================================================
       2. TÍTULO ATOYAC EN MONTSERRAT DELGADA
       =================================================================== */
    .brand-block {
      opacity: 0;
      transform: translateY(14px);
      animation: fadeInUp 0.8s 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      margin-bottom: 1.5rem;
    }

    .brand-title {
      font-family: var(--font-montserrat);
      font-weight: 200; /* Montserrat súper delgada */
      font-size: clamp(2.4rem, 7vw, 3.4rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--forest-dark);
      line-height: 1;
      padding-left: 0.28em;
    }

    .brand-tag {
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--icon-green);
      margin-top: 0.5rem;
      display: inline-block;
    }

    /* ===================================================================
       3. CONTADOR SENCILLO EN MONTSERRAT HASTA EL SÁBADO 5 DE DICIEMBRE
       =================================================================== */
    .countdown-section {
      width: 100%;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeInUp 0.8s 2.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      margin-bottom: 1.5rem;
    }

    .countdown-label {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--forest-sage);
      margin-bottom: 0.65rem;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      width: 100%;
    }

    .countdown-box {
      background: #FFFFFF;
      border: 1.5px solid var(--border-subtle);
      border-radius: 14px;
      padding: 0.65rem 0.35rem 0.5rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }

    .countdown-num {
      font-family: var(--font-montserrat);
      font-size: 1.6rem;
      font-weight: 300; /* Montserrat ligera */
      color: var(--forest-dark);
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .countdown-unit {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--forest-sage);
    }

    /* ===================================================================
       4. TARJETA FLOTANTE: CAFÉ GRATIS (SIN BORDE VERDE + EFECTO FLOTANDO)
       =================================================================== */
    .claim-card {
      width: 100%;
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.03);
      border-radius: 22px;
      padding: 1.25rem 1.25rem 1.35rem;
      box-shadow: 0 20px 42px -10px rgba(26, 40, 31, 0.08), 0 6px 18px rgba(0, 0, 0, 0.03);
      opacity: 0;
      transform: translateY(18px);
      animation: fadeInUp 0.8s 3.1s cubic-bezier(0.16, 1, 0.3, 1) forwards, floatCard 4.5s ease-in-out 3.9s infinite alternate;
    }

    @keyframes floatCard {
      0% {
        transform: translateY(0);
        box-shadow: 0 20px 42px -10px rgba(26, 40, 31, 0.08), 0 6px 18px rgba(0, 0, 0, 0.03);
      }
      100% {
        transform: translateY(-6px);
        box-shadow: 0 28px 52px -10px rgba(26, 40, 31, 0.13), 0 12px 26px rgba(0, 0, 0, 0.04);
      }
    }

    .claim-header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      margin-bottom: 1.15rem;
      text-align: left;
    }

    .steaming-coffee-wrap {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F4FAF5;
      border-radius: 50%;
      border: 1px solid rgba(30, 163, 85, 0.2);
    }

    .steaming-coffee-svg {
      width: 38px;
      height: 38px;
      overflow: visible;
    }

    /* Ondas de vapor de café subiendo y desvaneciéndose */
    .steam-wave {
      stroke: var(--icon-green);
      stroke-width: 2.2;
      stroke-linecap: round;
      fill: none;
      opacity: 0;
      transform-origin: bottom center;
      animation: steamFloat 2.2s ease-in-out infinite;
    }

    .steam-wave-1 { animation-delay: 0s; }
    .steam-wave-2 { animation-delay: 0.7s; }
    .steam-wave-3 { animation-delay: 1.4s; }

    @keyframes steamFloat {
      0% {
        opacity: 0;
        transform: translateY(4px) scaleX(0.9);
      }
      35% {
        opacity: 0.9;
      }
      70% {
        opacity: 0.6;
      }
      100% {
        opacity: 0;
        transform: translateY(-9px) scaleX(1.25);
      }
    }

    .claim-text-col {
      display: flex;
      flex-direction: column;
    }

    .claim-title {
      font-size: clamp(1.1rem, 4.2vw, 1.28rem);
      font-weight: 700;
      color: var(--forest-dark);
      margin-bottom: 0.15rem;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .claim-desc {
      font-size: clamp(0.78rem, 2.8vw, 0.86rem);
      font-weight: 500;
      color: var(--forest-sage);
      line-height: 1.35;
      margin: 0;
    }

    /* En una sola fila: Instagram + WhatsApp */
    .action-steps-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
    }

    /* Botón Instagram: Solo dice "Instagram" */
    .btn-step-ig {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      height: 48px;
      padding: 0 1.15rem;
      border-radius: 999px;
      background: #FFFFFF;
      border: 1.5px solid var(--border-subtle);
      color: var(--forest-dark);
      font-family: var(--font-montserrat);
      font-size: clamp(0.78rem, 2.5vw, 0.85rem);
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-step-ig:hover {
      border-color: #E1306C;
      color: #C13584;
      background: #FEF2F4;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(225, 48, 108, 0.15);
    }

    .btn-step-ig svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      fill: #C13584;
    }

    /* Botón WhatsApp: Ícono de WhatsApp + "Por WhatsApp" */
    .btn-step-wa {
      flex: 1;
      min-width: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      height: 48px;
      padding: 0 1rem;
      border-radius: 999px;
      background: var(--wa-green);
      color: #0B461D;
      font-family: var(--font-montserrat);
      font-size: clamp(0.76rem, 2.5vw, 0.84rem);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 16px rgba(37, 211, 102, 0.25);
    }

    .btn-step-wa:hover {
      background: #20bd5a;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(37, 211, 102, 0.35);
    }

    .btn-step-wa:active {
      transform: scale(0.98);
    }

    .btn-step-wa svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      fill: currentColor;
    }

    @media (max-width: 380px) {
      .btn-step-ig { padding: 0 0.85rem; }
      .btn-step-wa { padding: 0 0.75rem; }
      .action-steps-row { gap: 0.45rem; }
    }

    .footer-note {
      margin-top: 1.25rem;
      font-size: 0.74rem;
      color: #94A3B8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .footer-note a {
      color: var(--forest-sage);
      text-decoration: underline;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

    <div class="footer-note">

  </main>

  <!-- SCRIPT CUENTA REGRESIVA PRECISA HASTA SÁBADO 5 DE DICIEMBRE -->
  <script>
    const targetDate = new Date('2026-12-05T09:00:00-06:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById('cd-days').textContent = '0';
        document.getElementById('cd-hours').textContent = '00';
        document.getElementById('cd-mins').textContent = '00';
        document.getElementById('cd-secs').textContent = '00';
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('cd-days').textContent = days;
      document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
      document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>

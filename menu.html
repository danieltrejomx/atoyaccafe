      font-size: 0.88rem;

    .cat-btn svg {
      width: 18px;
      height: 18px;
      color: var(--icon-green);
      stroke: var(--icon-green);
      stroke-width: 2;
      fill: none;
      flex-shrink: 0;

    .cat-btn:hover {
      border-color: #9CA3AF;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    }

    .cat-btn.active {
      background: var(--forest-dark);
      border-color: var(--forest-dark);
      color: #FFFFFF;
      box-shadow: 0 6px 18px rgba(30, 45, 34, 0.2);
    }

      color: #7FE0A0;
      stroke: #7FE0A0;
    }

    /* ===================================================================
       CARRUSEL DE PRODUCTOS QUE SE MUEVE LENTAMENTE
       =================================================================== */
    .carousel-section {
      width: 100%;
      overflow: hidden;
      padding: 1rem 0 3.5rem;
      position: relative;
    }

    /* Sombras laterales para desvanecer bordes */
    .carousel-section::before,
    .carousel-section::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 60px;
      z-index: 10;
      pointer-events: none;
    }
    .carousel-section::before {
      left: 0;
      background: linear-gradient(to right, var(--bg-cream) 20%, rgba(251, 249, 245, 0) 100%);
    }
    .carousel-section::after {
      right: 0;
      background: linear-gradient(to left, var(--bg-cream) 20%, rgba(251, 249, 245, 0) 100%);
    }

    .carousel-track-wrapper {
      width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      display: flex;
    }
    .carousel-track-wrapper::-webkit-scrollbar {
      display: none;
    }

    .carousel-track {
      display: flex;
      gap: 1.5rem;
      width: max-content;
      animation: slowMarquee 38s linear infinite;
      padding: 0.5rem 1.5rem;
    }

    /* Al pasar el mouse o dedo por encima, se pausa suavemente para leer */
    .carousel-track:hover {
      animation-play-state: paused;
    }

    @keyframes slowMarquee {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

      const duplicated = [...items, ...items, ...items];

      track.innerHTML = duplicated.map(item => {
        const waText = encodeURIComponent(`¡Hola ATOYAC! Quiero pedir: ${item.name} ($${item.price} MXN) ☕🥪`);
        return `
          <article class="dish-card">
            <div class="dish-img-box">
              <img src="${item.image}" alt="${item.name}" class="dish-img" loading="lazy" />
              <span class="dish-tag">${item.tag}</span>
            </div>
            <div class="dish-info">
              <div>
                <h3 class="dish-name">${item.name}</h3>
                <p class="dish-desc">${item.desc}</p>
              </div>
              <div class="dish-footer">
                <div class="dish-price-wrap">
                  <span class="dish-price-label">Precio</span>
                  <div class="dish-price">$${item.price} <span>MXN</span></div>
                </div>
                <a href="https://wa.me/525658965015?text=${waText}" target="_blank" rel="noopener" class="dish-order-btn">
                  <span>Pedir</span>
                  <span>↗</span>
                </a>
              </div>
            </div>
          </article>
        `;
      }).join('');

      // Reiniciar animación para que vuelva a iniciar suavemente
      track.style.animation = 'none';
      track.offsetHeight; // trigger reflow
      track.style.animation = 'slowMarquee 36s linear infinite';
    }

    function switchCategory(catKey) {
      activeCat = catKey;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.category === catKey);
      });
      renderCarousel(catKey);
    }

    // Inicializar carrusel
    renderCarousel('chilaquiles');
  </script>

</body>
</html>
